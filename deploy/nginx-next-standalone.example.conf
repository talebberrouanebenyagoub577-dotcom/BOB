# -----------------------------------------------------------------------------
# مثال nginx: توجيه كل زيارات المتجر إلى Next.js (وضع standalone — node server.js)
# استخدمه عندما يكون frontend يعمل في Docker أو على 127.0.0.1:3000
#
# إذا استخدمت بدلاً منه إعداد Vite (root + try_files /index.html) فمسارات
# مثل /products/xxx قد ترجع 404 لأن الملف غير موجود على القرص.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name nidhamauto.shop www.nidhamauto.shop;

    # جميع مسارات الواجهة → خادم Next (لا تضع root للـ SPA هنا)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # واجهة الـ API خلف Next (rewrites في next.config) أو يوزّعها نفسك إلى الباكند
}
