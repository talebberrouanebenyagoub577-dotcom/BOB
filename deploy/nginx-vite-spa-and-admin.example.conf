# -----------------------------------------------------------------------------
# مثال nginx: موقع Vite ثابت (dist) + FastAPI على 127.0.0.1:8000
# Example: static Vite SPA — do NOT proxy all of /admin/ or the HTML page will break.
#
# - /admin في المتصفح → تطبيق React (index.html)
# - /admin/auth ، /admin/metrics ، /admin/orders ، /admin/diagnose → Python API
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name nidhamauto.shop;

    root /var/www/nidhamauto/dist;
    index index.html;

    # مهم لو JWT: بعض إعدادات الـ proxy تشيل الهيدر — بدون Bearer يطبّخ الـ SPA «جلسة منتهية» ويرجعك لصفحة الدخول.
    location ~ ^/admin/(auth|metrics|diagnose|orders)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
