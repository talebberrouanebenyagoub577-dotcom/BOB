services:
  db:
    image: postgres:16-alpine
    container_name: nidhamauto_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (NEVER default to a weak value)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: ghcr.io/talebberrouanebenyagoub577-dotcom/bob-backend:latest
    container_name: nidhamauto_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PORT: "5432"
      GOOGLE_SHEETS_WEBHOOK_URL: ${GOOGLE_SHEETS_WEBHOOK_URL:?set GOOGLE_SHEETS_WEBHOOK_URL in .env}
    networks: [internal, web]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bob-api.rule=Host(`api.nidhamauto.shop`)"
      - "traefik.http.routers.bob-api.entrypoints=websecure"
      - "traefik.http.routers.bob-api.tls.certresolver=le"
      - "traefik.http.services.bob-api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    image: ghcr.io/talebberrouanebenyagoub577-dotcom/bob-frontend:latest
    container_name: nidhamauto_frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nidhamauto.shop}
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: ${FRONTEND_INTERNAL_PORT:-3000}
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bob-web.rule=Host(`nidhamauto.shop`) || Host(`www.nidhamauto.shop`)"
      - "traefik.http.routers.bob-web.entrypoints=websecure"
      - "traefik.http.routers.bob-web.tls.certresolver=le"
      - "traefik.http.services.bob-web.loadbalancer.server.port=${FRONTEND_INTERNAL_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy

# pgweb removed from production stack.
# To access the DB ad-hoc (from your laptop):
#   ssh -L 8081:127.0.0.1:8081 root@<vps>
#   docker run --rm -d --name pgweb_tmp --network bob_internal \
#     -p 127.0.0.1:8081:8081 \
#     -e DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable" \
#     sosedoff/pgweb
#   open http://localhost:8081  # only reachable through the tunnel
#   docker rm -f pgweb_tmp  # tear down when done

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  pg_data:
