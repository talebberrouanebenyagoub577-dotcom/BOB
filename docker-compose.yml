version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nidhamauto_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: nidhamauto
      POSTGRES_PASSWORD: nidhamauto
      POSTGRES_DB: nidhamauto
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidhamauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: nidhamauto_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://nidhamauto:nidhamauto@db:5432/nidhamauto
      GOOGLE_SHEETS_WEBHOOK_URL: https://script.google.com/macros/s/AKfycbx5XizlWyjag71nA_0DRo1XqaBg-qfKjYcbKi1OvbkGNhQaGxKPpyKTQ0iYhJRlJ0Re/exec
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nidhamauto_frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  pgweb:
    image: sosedoff/pgweb
    container_name: nidhamauto_pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://nidhamauto:nidhamauto@db:5432/nidhamauto?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
