# بناء الواجهة والباكند ودفع الصور إلى GitHub Container Registry بعد كل push على main.
#
# تحديث السيرفر بدون SSH:
#   docker login ghcr.io -u GITHUB_USERNAME -p GITHUB_TOKEN_PAT(read:packages)
#   cd /مسار/MBO && git pull origin main && docker compose pull frontend backend && docker compose up -d frontend backend
#
# أو نشر تلقائي: Actions → هذا الـ workflow → Run workflow وسَمّيه «deploy» ✅
#   أضِف أسرار: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PROJECT_PATH
#   واختياري: GHCR_USERNAME, GHCR_READ_TOKEN (قراءة حزمة خاصّة)، و GHCR_REPOSITORY_OWNER بحروف صغيرة (نفس اسم المستخدم على GH)
name: Docker — GHCR ثم نشر اختياري

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "تشغيل نشر VPS عبر SSH (يتطلب أسرار DEPLOY_*)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: lc
        run: |
          o=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${o}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/bob-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lc.outputs.owner }}/bob-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    needs: build-push
    runs-on: ubuntu-latest
    # نشر VPS فقط بتشغيل يدوي: Actions → Run workflow → ✅ deploy (يتطلب أسرار DEPLOY_*)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    steps:
      - uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PROJECT_PATH }}"
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ]; then
              docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" -p "${{ secrets.GHCR_READ_TOKEN }}"
            fi
            git fetch origin main && git checkout main && git reset --hard origin/main
            docker compose pull frontend backend
            docker compose up -d frontend backend
